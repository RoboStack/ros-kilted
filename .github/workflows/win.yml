            if errorlevel 1 exit 1
            rem -m %FEEDSTOCK_ROOT%\.ci_support\conda_forge_pinnings.yaml
        )

        :: Check if .conda files exist in the win-64 directory
        if exist "%CONDA_BLD_PATH%\win-64\*.conda" (
            echo Found .conda files, starting upload...
            for %%F in ("%CONDA_BLD_PATH%\win-64\*.conda") do (
                echo Uploading %%F
                pixi run upload "%%F" --force
                if errorlevel 1 exit 1
            )
        ) else (
            echo Warning: No .conda files found in %CONDA_BLD_PATH%\win-64
            echo This might be due to all the packages being skipped
        )
      env:
        ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
        CURRENT_RECIPES: ros2-moveit-setup-assistant ros2-ur-moveit-config ros-kilted-moveit-setup-srdf-plugins
          ros-kilted-moveit-setup-core-plugins ros-kilted-moveit-setup-controllers
          ros-kilted-moveit-setup-app-plugins ros-kilted-moveit-ros-trajectory-cache
          ros-kilted-moveit-planners ros2-ur-simulation-gz ros2-ur ros2-moveit ros-kilted-ur-moveit-config
          ros-kilted-moveit-setup-assistant ros-kilted-ur-simulation-gz ros-kilted-ur
          ros-kilted-moveit
        PYTHONUNBUFFERED: 1
      name: Build ros2-moveit-setup-assistant ros2-ur-moveit-config ros-kilted-moveit-setup-srdf-plugins
        ros-kilted-moveit-setup-core-plugins ros-kilted-moveit-setup-controllers ros-kilted-moveit-setup-app-plugins
        ros-kilted-moveit-ros-trajectory-cache ros-kilted-moveit-planners ros2-ur-simulation-gz
        ros2-ur ros2-moveit ros-kilted-ur-moveit-config ros-kilted-moveit-setup-assistant
        ros-kilted-ur-simulation-gz ros-kilted-ur ros-kilted-moveit
    permissions:
      id-token: write
      attestations: write
name: build_win
on:
  push:
    branches:
    - buildbranch_win
