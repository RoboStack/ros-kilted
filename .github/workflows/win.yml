jobs:
  stage_0_job_0:
    name: ros2-ament-lint-common ros2-launch-testing ros2-foonathan-memory-vendor
      ros2-gz-cmake-vendor ros2-rviz-ogre-vendor ros2-rviz-assimp-vendor ros2-autoware-lint-common
      ros2-rmf-utils ros2-gz-dartsim-vendor ros2-ament-cmake-black random-numbers
      moveit-resources-prbt-support microstrain-inertial-description launch-yaml launch-xml
      eigen3-cmake-module ament-cmake-xmllint ament-cmake-uncrustify ament-cmake-pep257
      ament-cmake-pclint ament-cmake-mypy
    runs-on: windows-2022
    strategy:
      fail-fast: false
    needs: []
    env:
      CONDA_BLD_PATH: C:\\bld\\
      VINCA_CUSTOM_CMAKE_BUILD_DIR: C:\\x\\
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Disable git auto-maintenance
      run: git config --global maintenance.auto false && git config --global gc.auto
        0
    - name: Setup pixi
      uses: prefix-dev/setup-pixi@v0
      with:
        pixi-version: latest
        cache: 'true'
        log-level: v
        frozen: 'true'
    - uses: egor-tensin/cleanup-path@v5
      with:
        dirs: C:\Program Files\Git\usr\bin;C:\Program Files\Git\bin;C:\Program Files\Git\cmd;C:\Program
          Files\Git\mingw64\bin
    - shell: cmd
      run: |
        set "CI=true"

        :: 4 cores available on GHA: https://docs.github.com/en/actions/using-github-hosted-runners/about-github-hosted-runners/about-github-hosted-runners
        :: CPU_COUNT is passed through conda build: https://github.com/conda/conda-build/pull/1149
        set CPU_COUNT=4

        set PYTHONUNBUFFERED=1

        call setup_x64

        :: Set the conda-build working directory to a smaller path
        if "%CONDA_BLD_PATH%" == "" (
            set "CONDA_BLD_PATH=C:\\bld\\"
        )

        :: Hosted runners may have libcrypto*.dll & libssl*.dll under
        :: C:\\Windows\\System32, which should not be there (no vendor dlls in windows folder).
        :: They would be found before the openssl libs of the conda environment, so we delete them.
        if defined CI (
            DEL C:\\Windows\\System32\\libcrypto-1_1-x64.dll || (Echo Ignoring failure to delete C:\\Windows\\System32\\libcrypto-1_1-x64.dll)
            DEL C:\\Windows\\System32\\libssl-1_1-x64.dll || (Echo Ignoring failure to delete C:\\Windows\\System32\\libssl-1_1-x64.dll)
        )

        :: Make paths like C:\\hostedtoolcache\\windows\\Ruby\\2.5.7\\x64\\bin garbage
        set "PATH=%PATH:ostedtoolcache=%"
      name: conda-forge build setup
    - shell: cmd
      run: |
        setlocal EnableExtensions EnableDelayedExpansion

        set CONDA_BLD_PATH=C:\bld
        echo "PATH is %PATH%"

        rmdir /Q/S C:\Strawberry\
        rmdir /Q/S "C:\Program Files (x86)\Windows Kits\10\Include\10.0.17763.0\"

        set "FEEDSTOCK_ROOT=%cd%"

        mkdir %CONDA_BLD_PATH%

        :: Enable long path names on Windows
        reg add HKLM\SYSTEM\CurrentControlSet\Control\FileSystem /v LongPathsEnabled /t REG_DWORD /d 1 /f

        for %%X in (%CURRENT_RECIPES%) do (
            echo "BUILDING RECIPE %%X"
            cd %FEEDSTOCK_ROOT%\recipes\%%X\
            pixi run -v rattler-build build --recipe %FEEDSTOCK_ROOT%\recipes\%%X\ ^
                -m %FEEDSTOCK_ROOT%\conda_build_config.yaml ^
                -c robostack-kilted -c conda-forge ^
                --output-dir %CONDA_BLD_PATH%

            if errorlevel 1 exit 1
            rem -m %FEEDSTOCK_ROOT%\.ci_support\conda_forge_pinnings.yaml
        )

        :: Check if .conda files exist in the win-64 directory
        if exist "%CONDA_BLD_PATH%\win-64\*.conda" (
            echo Found .conda files, starting upload...
            for %%F in ("%CONDA_BLD_PATH%\win-64\*.conda") do (
                echo Uploading %%F
                pixi run upload "%%F" --force
                if errorlevel 1 exit 1
            )
        ) else (
            echo Warning: No .conda files found in %CONDA_BLD_PATH%\win-64
            echo This might be due to all the packages being skipped
        )
      env:
        ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
        CURRENT_RECIPES: ros2-ament-lint-common ros2-launch-testing ros2-foonathan-memory-vendor
          ros2-gz-cmake-vendor ros2-rviz-ogre-vendor ros2-rviz-assimp-vendor ros2-autoware-lint-common
          ros2-rmf-utils ros2-gz-dartsim-vendor ros2-ament-cmake-black ros-kilted-random-numbers
          ros-kilted-moveit-resources-prbt-support ros-kilted-microstrain-inertial-description
          ros-kilted-launch-yaml ros-kilted-launch-xml ros-kilted-eigen3-cmake-module
          ros-kilted-ament-cmake-xmllint ros-kilted-ament-cmake-uncrustify ros-kilted-ament-cmake-pep257
          ros-kilted-ament-cmake-pclint ros-kilted-ament-cmake-mypy
        PYTHONUNBUFFERED: 1
      name: Build ros2-ament-lint-common ros2-launch-testing ros2-foonathan-memory-vendor
        ros2-gz-cmake-vendor ros2-rviz-ogre-vendor ros2-rviz-assimp-vendor ros2-autoware-lint-common
        ros2-rmf-utils ros2-gz-dartsim-vendor ros2-ament-cmake-black ros-kilted-random-numbers
        ros-kilted-moveit-resources-prbt-support ros-kilted-microstrain-inertial-description
        ros-kilted-launch-yaml ros-kilted-launch-xml ros-kilted-eigen3-cmake-module
        ros-kilted-ament-cmake-xmllint ros-kilted-ament-cmake-uncrustify ros-kilted-ament-cmake-pep257
        ros-kilted-ament-cmake-pclint ros-kilted-ament-cmake-mypy
