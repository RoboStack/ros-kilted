# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-rmf-visualization
  version: 2.4.2
source:
  git: https://github.com/ros2-gbp/rmf_visualization-release.git
  tag: release/kilted/rmf_visualization/2.4.2-1
  target_directory: ros2-rmf-visualization/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 23
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  repository: https://github.com/open-rmf/rmf_visualization
  license: Apache-2.0
  summary: Package containing a single launch file to bringup various visualizations
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - pip
    - python
    - ros2-ament-cmake
    - ros2-distro-mutex 0.18.* kilted_*
    - ros2-ros-environment
    - ros2-ros-workspace
  run:
    - python
    - ros2-distro-mutex 0.18.* kilted_*
    - ros2-launch-xml
    - ros2-rmf-visualization-building-systems
    - ros2-rmf-visualization-fleet-states
    - ros2-rmf-visualization-floorplans
    - ros2-rmf-visualization-navgraphs
    - ros2-rmf-visualization-obstacles
    - ros2-rmf-visualization-rviz2-plugins
    - ros2-rmf-visualization-schedule
    - ros2-ros-workspace
