# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-sick-safetyscanners2
  version: 1.0.5
source:
  git: https://github.com/ros2-gbp/sick_safetyscanners2-release.git
  tag: release/kilted/sick_safetyscanners2/1.0.5-1
  target_directory: ros2-sick-safetyscanners2/src/work
  patches:
    - patch/ros-kilted-sick-safetyscanners2.patch

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 23
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  repository: https://github.com/SICKAG/sick_safetyscanners2
  license: Apache-2.0
  summary: ROS2 Driver for the SICK safetyscanners
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - libboost-devel
    - libboost-python-devel
    - numpy
    - pip
    - python
    - ros2-ament-cmake
    - ros2-ament-cmake-pytest
    - ros2-ament-lint-auto
    - ros2-ament-lint-common
    - ros2-diagnostic-updater
    - ros2-distro-mutex 0.18.* kilted_*
    - ros2-launch-testing-ament-cmake
    - ros2-launch-testing-ros
    - ros2-rclcpp
    - ros2-rclcpp-lifecycle
    - ros2-ros-environment
    - ros2-ros-workspace
    - ros2-sensor-msgs
    - ros2-sick-safetyscanners-base
    - ros2-sick-safetyscanners2-interfaces
    - ros2-xacro
    - urdfdom
  run:
    - libboost-devel
    - libboost-python-devel
    - python
    - ros2-diagnostic-updater
    - ros2-distro-mutex 0.18.* kilted_*
    - ros2-rclcpp
    - ros2-rclcpp-lifecycle
    - ros2-robot-state-publisher
    - ros2-ros-workspace
    - ros2-rviz2
    - ros2-sensor-msgs
    - ros2-sick-safetyscanners-base
    - ros2-sick-safetyscanners2-interfaces
    - ros2-xacro
