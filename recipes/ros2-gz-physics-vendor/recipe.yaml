# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-gz-physics-vendor
  version: 0.2.6
source:
  git: https://github.com/ros2-gbp/gz_physics_vendor-release.git
  tag: release/kilted/gz_physics_vendor/0.2.6-1
  target_directory: ros2-gz-physics-vendor/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 23
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: https://github.com/gazebosim/gz-physics
  repository: https://github.com/gazebo-release/gz_physics_vendor
  license: Apache-2.0
  summary: 'Vendor package for: gz-physics8 8.4.0 Gazebo Physics : Physics classes and functions for robot applications'
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
  host:
    - benchmark
    - if: build_platform == target_platform
      then:
        - pkg-config
    - bullet
    - eigen
    - eigen-abi-devel
    - gz-physics8
    - numpy
    - pip
    - python
    - ros2-ament-cmake-copyright
    - ros2-ament-cmake-core
    - ros2-ament-cmake-lint-cmake
    - ros2-ament-cmake-test
    - ros2-ament-cmake-vendor-package
    - ros2-ament-cmake-xmllint
    - ros2-distro-mutex 0.18.* kilted_*
    - ros2-gz-cmake-vendor
    - ros2-gz-common-vendor
    - ros2-gz-dartsim-vendor
    - ros2-gz-math-vendor
    - ros2-gz-plugin-vendor
    - ros2-gz-utils-vendor
    - ros2-ros-environment
    - ros2-ros-workspace
    - ros2-sdformat-vendor
  run:
    - benchmark
    - bullet
    - eigen
    - eigen-abi-devel
    - gz-physics8
    - python
    - ros2-distro-mutex 0.18.* kilted_*
    - ros2-gz-cmake-vendor
    - ros2-gz-common-vendor
    - ros2-gz-dartsim-vendor
    - ros2-gz-math-vendor
    - ros2-gz-plugin-vendor
    - ros2-gz-utils-vendor
    - ros2-ros-workspace
    - ros2-sdformat-vendor
