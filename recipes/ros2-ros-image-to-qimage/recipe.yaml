# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-ros-image-to-qimage
  version: 0.4.1
source:
  git: https://github.com/ros2-gbp/ros_image_to_qimage-release.git
  tag: release/kilted/ros_image_to_qimage/0.4.1-4
  target_directory: ros2-ros-image-to-qimage/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 23
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  repository: https://github.com/ros-sports/ros_image_to_qimage
  license: Apache-2.0
  summary: A package that converts a ros image msg to a qimage object
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
    - if: build_platform != target_platform
      then:
        - qt-main
  host:
    - ${{ 'libgl-devel' if linux }}
    - ${{ 'libopengl-devel' if linux }}
    - if: build_platform == target_platform
      then:
        - pkg-config
    - libgl-devel
    - libopengl-devel
    - numpy
    - pip
    - python
    - qt-main
    - ros2-ament-cmake
    - ros2-ament-cmake-gtest
    - ros2-ament-cmake-pytest
    - ros2-ament-cmake-python
    - ros2-ament-lint-auto
    - ros2-ament-lint-common
    - ros2-cv-bridge
    - ros2-distro-mutex 0.18.* kilted_*
    - ros2-python-qt-binding
    - ros2-ros-environment
    - ros2-ros-workspace
    - ros2-sensor-msgs
  run:
    - libgl-devel
    - libopengl-devel
    - python
    - qt-main
    - ros2-cv-bridge
    - ros2-distro-mutex 0.18.* kilted_*
    - ros2-python-qt-binding
    - ros2-ros-workspace
    - ros2-sensor-msgs
