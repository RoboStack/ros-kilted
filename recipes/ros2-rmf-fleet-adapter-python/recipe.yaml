# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-rmf-fleet-adapter-python
  version: 2.10.1
source:
  git: https://github.com/ros2-gbp/rmf_ros2-release.git
  tag: release/kilted/rmf_fleet_adapter_python/2.10.1-1
  target_directory: ros2-rmf-fleet-adapter-python/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 23
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  repository: https://github.com/open-rmf/rmf_ros2
  license: Apache-2.0
  summary: Python bindings for the rmf_fleet_adapter
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
    - if: build_platform != target_platform
      then:
        - pybind11
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - pip
    - python
    - ros2-ament-cmake-pytest
    - ros2-distro-mutex 0.18.* kilted_*
    - ros2-pybind11-json-vendor
    - ros2-pybind11-vendor
    - ros2-rclpy
    - ros2-rmf-fleet-adapter
    - ros2-ros-environment
    - ros2-ros-workspace
    - pybind11
  run:
    - python
    - ros2-distro-mutex 0.18.* kilted_*
    - ros2-pybind11-json-vendor
    - ros2-pybind11-vendor
    - ros2-rclpy
    - ros2-rmf-fleet-adapter
    - ros2-ros-workspace
