# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-rmf-fleet-adapter
  version: 2.10.1
source:
  git: https://github.com/ros2-gbp/rmf_ros2-release.git
  tag: release/kilted/rmf_fleet_adapter/2.10.1-1
  target_directory: ros2-rmf-fleet-adapter/src/work
  patches:
    - patch/ros-kilted-rmf-fleet-adapter.patch

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 23
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  repository: https://github.com/open-rmf/rmf_ros2
  license: Apache-2.0
  summary: Fleet Adapter package for RMF fleets.
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - eigen
    - eigen-abi-devel
    - nlohmann_json
    - numpy
    - pip
    - python
    - ros2-ament-cmake
    - ros2-ament-cmake-catch2
    - ros2-ament-cmake-uncrustify
    - ros2-backward-ros
    - ros2-distro-mutex 0.18.* kilted_*
    - ros2-nlohmann-json-schema-validator-vendor
    - ros2-rclcpp
    - ros2-rclcpp-action
    - ros2-rclcpp-components
    - ros2-rmf-api-msgs
    - ros2-rmf-battery
    - ros2-rmf-building-map-msgs
    - ros2-rmf-dispenser-msgs
    - ros2-rmf-door-msgs
    - ros2-rmf-fleet-msgs
    - ros2-rmf-ingestor-msgs
    - ros2-rmf-lift-msgs
    - ros2-rmf-reservation-msgs
    - ros2-rmf-task
    - ros2-rmf-task-msgs
    - ros2-rmf-task-ros2
    - ros2-rmf-task-sequence
    - ros2-rmf-traffic
    - ros2-rmf-traffic-ros2
    - ros2-rmf-utils
    - ros2-rmf-websocket
    - ros2-ros-environment
    - ros2-ros-workspace
    - ros2-std-msgs
    - yaml-cpp
  run:
    - nlohmann_json
    - python
    - ros2-backward-ros
    - ros2-distro-mutex 0.18.* kilted_*
    - ros2-nlohmann-json-schema-validator-vendor
    - ros2-rclcpp
    - ros2-rclcpp-action
    - ros2-rclcpp-components
    - ros2-rmf-api-msgs
    - ros2-rmf-battery
    - ros2-rmf-building-map-msgs
    - ros2-rmf-dispenser-msgs
    - ros2-rmf-door-msgs
    - ros2-rmf-fleet-msgs
    - ros2-rmf-ingestor-msgs
    - ros2-rmf-lift-msgs
    - ros2-rmf-reservation-msgs
    - ros2-rmf-task
    - ros2-rmf-task-msgs
    - ros2-rmf-task-ros2
    - ros2-rmf-task-sequence
    - ros2-rmf-traffic
    - ros2-rmf-traffic-ros2
    - ros2-rmf-utils
    - ros2-rmf-websocket
    - ros2-ros-workspace
    - ros2-std-msgs
