# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-rmf-visualization-rviz2-plugins
  version: 2.4.2
source:
  git: https://github.com/ros2-gbp/rmf_visualization-release.git
  tag: release/kilted/rmf_visualization_rviz2_plugins/2.4.2-1
  target_directory: ros2-rmf-visualization-rviz2-plugins/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 23
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  repository: https://github.com/open-rmf/rmf_visualization
  license: Apache-2.0
  summary: A package containing RViz2 plugins for RMF
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
    - if: build_platform != target_platform
      then:
        - qt-main
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - eigen
    - eigen-abi-devel
    - libgl-devel
    - libopengl-devel
    - numpy
    - pip
    - python
    - qt-main
    - ros2-ament-cmake
    - ros2-ament-cmake-uncrustify
    - ros2-distro-mutex 0.18.* kilted_*
    - ros2-pluginlib
    - ros2-rclcpp
    - ros2-resource-retriever
    - ros2-rmf-door-msgs
    - ros2-rmf-lift-msgs
    - ros2-rmf-traffic-ros2
    - ros2-rmf-utils
    - ros2-rmf-visualization-msgs
    - ros2-ros-environment
    - ros2-ros-workspace
    - ros2-rviz-common
    - ros2-rviz-default-plugins
    - ros2-rviz-rendering
  run:
    - libgl-devel
    - libopengl-devel
    - python
    - qt-main
    - ros2-distro-mutex 0.18.* kilted_*
    - ros2-pluginlib
    - ros2-rclcpp
    - ros2-resource-retriever
    - ros2-rmf-door-msgs
    - ros2-rmf-lift-msgs
    - ros2-rmf-traffic-ros2
    - ros2-rmf-visualization-msgs
    - ros2-ros-workspace
    - ros2-rviz-common
    - ros2-rviz-default-plugins
    - ros2-rviz-rendering
