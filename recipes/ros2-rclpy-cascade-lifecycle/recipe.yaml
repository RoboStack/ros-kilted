# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-rclpy-cascade-lifecycle
  version: 2.0.4
source:
  git: https://github.com/ros2-gbp/cascade_lifecycle-release.git
  tag: release/kilted/rclpy_cascade_lifecycle/2.0.4-1
  target_directory: ros2-rclpy-cascade-lifecycle/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_python.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_python.bat' }}
  number: 23
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  repository: https://github.com/fmrico/cascade_lifecycle
  license: Apache-2.0
  summary: Provides a mechanism to make trees of lifecycle nodes to propagate state changes in python
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - pip
    - pytest
    - python
    - ros2-ament-copyright
    - ros2-ament-flake8
    - ros2-ament-pep257
    - ros2-cascade-lifecycle-msgs
    - ros2-distro-mutex 0.18.* kilted_*
    - ros2-lifecycle-msgs
    - ros2-rclcpp
    - ros2-rclcpp-lifecycle
    - ros2-ros-environment
    - ros2-ros-workspace
    - setuptools
  run:
    - python
    - ros2-cascade-lifecycle-msgs
    - ros2-distro-mutex 0.18.* kilted_*
    - ros2-lifecycle-msgs
    - ros2-rclcpp
    - ros2-rclcpp-lifecycle
    - ros2-ros-workspace
