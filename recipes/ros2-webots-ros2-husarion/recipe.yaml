# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-webots-ros2-husarion
  version: 2025.0.1
source:
  git: https://github.com/ros2-gbp/webots_ros2-release.git
  tag: release/kilted/webots_ros2_husarion/2025.0.1-1
  target_directory: ros2-webots-ros2-husarion/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_python.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_python.bat' }}
  number: 23
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: http://wiki.ros.org/webots_ros2
  repository: https://github.com/cyberbotics/webots_ros2
  license: Apache-2.0
  summary: Husarion ROSbot 2R and XL robots ROS2 interface for Webots.
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - pip
    - python
    - ros2-distro-mutex 0.18.* kilted_*
    - ros2-ros-environment
    - ros2-ros-workspace
    - setuptools
  run:
    - python
    - ros2-controller-manager
    - ros2-diff-drive-controller
    - ros2-distro-mutex 0.18.* kilted_*
    - ros2-joint-state-broadcaster
    - ros2-laser-filters
    - ros2-robot-localization
    - ros2-robot-state-publisher
    - ros2-ros-workspace
    - ros2-webots-ros2-control
    - ros2-webots-ros2-driver
