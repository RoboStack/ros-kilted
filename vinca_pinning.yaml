conda_forge_pinning_version: 2026.09.01.16.28.00
migrations:
  - giflib6
  - go_macos
  - gstreamer128
  - hdf52
  - libboost190
  - pybind11_abi11
pinning_overrides:
  # Build commands provide their channels with `-c`, so omit the inherited
  # conda-forge-pinning channel_sources value from the rendered configuration.
  channel_sources: null
  channel_targets: null
  # Kilted build 23 was compiled with gcc 14 / clang 19 against glibc 2.17 and macOS 12.0.
  # c_stdlib_version shares a zip_keys group with the compiler versions, so the whole
  # group has to be overridden; the compiler entries mirror the conda-forge base file
  # and must be refreshed when `vinca-pinning-update` moves to a newer compiler.
  c_stdlib_version:
    - 2.17                       # [linux and not riscv64]
    - 2.39                       # [linux and riscv64]
    - 2.17                       # [linux and (x86_64 or aarch64) and os.environ.get("CF_CUDA_ENABLED", "False") == "True"]
    - 12.0                       # [osx]
  c_compiler_version:
    - 14                         # [linux]
    - 19                         # [osx]
    - 14                         # [linux and (x86_64 or aarch64) and os.environ.get("CF_CUDA_ENABLED", "False") == "True"]
  cxx_compiler_version:
    - 14                         # [linux]
    - 19                         # [osx]
    - 14                         # [linux and (x86_64 or aarch64) and os.environ.get("CF_CUDA_ENABLED", "False") == "True"]
  fortran_compiler_version:
    - 14                         # [unix]
    - 5                          # [win64]
    - 22                         # [win and arm64]
    - 14                         # [linux and (x86_64 or aarch64) and os.environ.get("CF_CUDA_ENABLED", "False") == "True"]
  cuda_compiler_version:
    - None
    - 12.9                       # [((linux and (x86_64 or aarch64)) or win64) and os.environ.get("CF_CUDA_ENABLED", "False") == "True"]
  # Workaround for https://github.com/RoboStack/ros-jazzy/pull/40#issuecomment-2782226697
  cmake:
    - 3.*
  # conda-forge's base pinning moved to OpenCV 5; kilted is still built against 4.13.
  libopencv:
    - 4.13.0
  # conda-forge pins libprotobuf only; keep the Python package on the same release.
  protobuf:
    - 7.35.1
  libzenohc:
    - 1.9.0
  libzenohcxx:
    - 1.9.0
  # cartographer was built with lua 5.4.8, otherwise it pulls in 5.5 which leads to conflicts
  lua:
    - 5.4
  shaderc:
    - '2026.4'
  # conda-forge's sip 6.16.x regressed ABI targeting for PyQt5-based bindings
  # (qt_gui_cpp_sip fails with "ABI v12 is being targeted but the module doesn't
  # support it"). Pin to the last known-good line.
  sip:
    - 6.15
  # Kept at the exact values build 23 was hashed with (the urdfdom6 migration would
  # render '6' and no urdfdom_headers pin, changing every urdfdom consumer's build string).
  urdfdom:
    - '6.0'
  urdfdom_headers:
    - '3.0'
  python:
    - 3.12.* *_cpython
  is_python_min:
    - false
  python_impl:
    - cpython
