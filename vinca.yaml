ros_distro: kilted

# mapping for package keys
conda_index:
  - robostack.yaml
  - packages-ignore.yaml

# Reminder for next full rebuild, the next build number should be 23
build_number: 21

mutex_package:
  name: "ros2-distro-mutex"
  version: "0.17.0"
  upper_bound: "x.x"
  run_constraints:
    - libboost 1.90.*
    - libboost-devel 1.90.*
    - pcl 1.15.1.*
    - gazebo 11.*
    - libprotobuf 6.33.5.*
    - vtk 9.6.2.*

packages_skip_by_deps:

  - if: not linux
    then:
      - pendulum_control
      - rttest
      - tlsf
      - tlsf_cpp

packages_remove_from_deps:

  - if: not linux
    then:
      - pendulum_control
      - rttest
      - tlsf
      - tlsf_cpp

skip_existing:
  # - output
  - https://conda.anaconda.org/robostack-kilted/

packages_select_by_deps:
  - ackermann-msgs
  - ament_cmake_black
  - ament_cmake_catch2
  - ament_cmake_clang_tidy
  - ament_cmake_core
  - ament_cmake_mypy
  - apriltag_detector
  - apriltag_ros
  - asio_cmake_module
