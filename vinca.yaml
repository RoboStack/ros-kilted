ros_distro: kilted

package_name_mode: both

# mapping for package keys
conda_index:
  - robostack.yaml
  - packages-ignore.yaml

# Reminder for next full rebuild, the next build number should be 24
build_number: 23

mutex_package:
  name: "ros2-distro-mutex"
  version: "0.18.0"
  upper_bound: "x.x"
  run_constraints:
    - libboost 1.90.*
    - libboost-devel 1.90.*
    - pcl 1.15.1.*
    - gazebo 11.*
    - libprotobuf 7.35.1.*
    - vtk 9.6.2.*

packages_skip_by_deps:

  - if: not linux
    then:
      - pendulum_control
      - rttest
      - tlsf
      - tlsf_cpp

packages_remove_from_deps:

  - if: not linux
    then:
      - pendulum_control
      - rttest
      - tlsf
      - tlsf_cpp

skip_existing:
  # - output
  - https://conda.anaconda.org/robostack-kilted/

