  - desktop
  - desktop_full
  - dev_tools
  - diagnostics
  - flex_sync
  - foxglove_bridge
  - foxglove_msgs
  - gripper_controllers
  - gtsam
  - gz_ros2_control
  - gz_ros2_control_demos
  - lanelet2
  - magic_enum
  - moveit
  - moveit-chomp-optimizer-adapter  # Requested in https://www.linkedin.com/feed/update/urn:li:activity:7346559234177703938/
  - moveit-planners-chomp
  - moveit-ros-control-interface
  - moveit-ros-trajectory-cache
  - moveit-servo
  - moveit-visual-tools
  - nav2_bringup
  - navigation2
  - perception
  - polygon_msgs
  - proxsuite
  - py-trees
